{{- /* Mermaid diagrams, loaded only on pages that contain a ```mermaid block. */ -}}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "base",
    fontFamily: '"Mona Sans", system-ui, sans-serif',
    themeVariables: {
      fontSize: "15px",
      primaryColor: "#eefaf0",
      primaryBorderColor: "#141a16",
      primaryTextColor: "#141a16",
      secondaryColor: "#ffe2c4",
      tertiaryColor: "#ffffff",
      lineColor: "#4c564f",
      clusterBkg: "#f7faf8",
      clusterBorder: "#d3eedb"
    }
  });
</script>
